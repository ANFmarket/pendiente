<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Pendiente</title>
<link rel="manifest" href="manifest.json">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<meta name="theme-color" content="#007aff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pendiente">

<style>
    * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f5f5f7;
        color: #111;
    }

    .app {
        max-width: 520px;
        margin: auto;
        min-height: 100vh;
        background: white;
        padding: 55px 22px 35px;
    }

    .fecha {
        color: #777;
        font-size: 15px;
        margin-bottom: 4px;
    }

    h1 {
        font-size: 38px;
        margin: 0 0 10px;
    }

    .contador {
        display: inline-block;
        background: #f0f4f9;
        padding: 7px 13px;
        border-radius: 20px;
        font-size: 13px;
        margin-bottom: 28px;
    }

    #lista {
        margin-bottom: 25px;
    }

    .pendiente {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        padding: 14px 2px;
        border-bottom: 1px solid #eee;
    }

    .check {
        width: 27px;
        height: 27px;
        border: 2px solid #bbb;
        border-radius: 50%;
        flex-shrink: 0;
        cursor: pointer;
        margin-top: 1px;
    }

    .check.hecho {
        background: #007aff;
        border-color: #007aff;
        position: relative;
    }

    .check.hecho::after {
        content: "✓";
        color: white;
        position: absolute;
        left: 5px;
        top: 0px;
        font-size: 18px;
        font-weight: bold;
    }

    .contenido {
        flex: 1;
    }

    .texto {
        font-size: 17px;
        line-height: 1.3;
    }

    .terminado .texto {
        text-decoration: line-through;
        color: #999;
    }

    .hora {
        font-size: 13px;
        color: #777;
        margin-top: 5px;
    }

    .editar {
        border: none;
        background: #f0f4f9;
        color: #007aff;
        border-radius: 8px;
        padding: 9px 8px;
        cursor: pointer;
        font-size: 13px;
    }

    .contenido { min-width: 0; overflow-wrap: anywhere; }

    .borrar {
        border: none;
        background: transparent;
        color: #bbb;
        font-size: 20px;
        cursor: pointer;
        padding: 0 4px;
    }

    .agregar {
        width: 100%;
        border: none;
        background: #007aff;
        color: white;
        font-size: 17px;
        font-weight: 600;
        padding: 15px;
        border-radius: 13px;
        cursor: pointer;
    }

    .finalizados-titulo {
        margin-top: 28px;
        padding: 14px 0;
        font-size: 14px;
        font-weight: 600;
        color: #666;
        border-top: 1px solid #eee;
    }

    .modal-fondo {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,.35);
        display: none;
        align-items: flex-end;
        justify-content: center;
    }

    .modal {
        width: 100%;
        max-width: 520px;
        background: white;
        border-radius: 20px 20px 0 0;
        padding: 25px 22px 35px;
    }

    .modal h2 {
        margin-top: 0;
        font-size: 23px;
    }

    input {
        width: 100%;
        padding: 15px;
        border: 1px solid #ddd;
        border-radius: 12px;
        font-size: 17px;
        outline: none;
        margin-bottom: 14px;
    }

    input:focus {
        border-color: #007aff;
    }

    .aviso {
        font-size: 14px;
        font-weight: 600;
        margin: 8px 0;
    }

    input[type="datetime-local"] {
        font-size: 15px;
    }

    .guardar {
        width: 100%;
        border: none;
        background: #007aff;
        color: white;
        padding: 14px;
        border-radius: 12px;
        font-size: 17px;
        font-weight: 600;
        cursor: pointer;
    }

    .cancelar {
        width: 100%;
        border: none;
        background: transparent;
        color: #007aff;
        padding: 14px;
        font-size: 16px;
        cursor: pointer;
        margin-top: 5px;
    }

    .vacio {
        text-align: center;
        color: #999;
        padding: 35px 10px;
    }
</style>
</head>

<body>

<div class="app">

    <div class="fecha" id="fecha"></div>

    <h1>Hoy</h1>

    <div class="contador" id="contador">
        0 pendientes · 0 terminados
    </div>

    <div id="lista"></div>

    <button class="agregar" onclick="abrirModal()">
        ＋ Agregar pendiente
    </button>
<button
    id="btnNotificaciones"
    onclick="activarNotificaciones()"
    style="
        width:100%;
        border:none;
        background:#f0f4f9;
        color:#007aff;
        font-size:15px;
        font-weight:600;
        padding:13px;
        border-radius:13px;
        cursor:pointer;
        margin-top:10px;
    ">
    🔔 Activar recordatorios
</button>
<button id="btnPaloma" type="button" onclick="activarPaloma()" style="width:100%;border:0;background:#f0f4f9;color:#007aff;padding:13px;border-radius:13px;margin-top:10px;font-size:15px;font-weight:600;cursor:pointer">🔇 Sonido desactivado</button>
<div id="estadoPaloma" role="status" style="font-size:12px;color:#777;margin:8px 3px">Sonido con la app visible. Toca el botón cada vez que la abras.</div>
<div id="avisoPaloma" role="status" style="display:none;background:#f0f4f9;padding:14px;border-radius:12px;margin-top:12px;overflow-wrap:anywhere"></div>
<div class="finalizados-titulo">
        Finalizados de hoy
    </div>

    <div id="finalizados"></div>

</div>

<div class="modal-fondo" id="modalFondo">

    <div class="modal">

        <h2 id="tituloModal">¿Qué tienes pendiente?</h2>

        <input
            id="nuevoPendiente"
            type="text"
            placeholder="Escribe tu pendiente..."
            autocomplete="off"
        >

        <div class="aviso">🔔 Avisarme (opcional)</div>

        <input
            id="fechaAviso"
            type="datetime-local"
        >

        <button class="guardar" onclick="guardarPendiente()">
            Guardar
        </button>

        <button class="cancelar" onclick="cerrarModal()">
            Cancelar
        </button>

    </div>

</div>

<script>
const SUPABASE_URL = "https://pteopgkjtaggattgmrue.supabase.co";
const SUPABASE_KEY = "sb_publishable_Hs72KK_8xIX_ZgNFLFEYbw_wjHmRVSV";
const VAPID_PUBLIC_KEY = "BLVuCTL8nGx1z--JVIxYnzB7HIta0oDieZC_ah8y877is5RcnpiGEWB5xfBDe0D05phv9s5YyOYWudJPKc_-kxg";


const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);
let pendientes = JSON.parse(localStorage.getItem("pendientes")) || [];

let editandoId = null;

async function iniciarSesion() {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) {
        const { error } = await supabaseClient.auth.signInAnonymously();
        if (error) { console.error("Error de autenticación:", error.message); return; }
    }
}
iniciarSesion();

async function activarNotificaciones() {
    try {
        if (!("Notification" in window) || !("serviceWorker" in navigator) || !("PushManager" in window)) {
            alert("Este navegador no admite notificaciones push.");
            return;
        }
        const permiso = await Notification.requestPermission();
        if (permiso !== "granted") {
            alert("Necesitamos permiso para las notificaciones.");
            return;
        }
        const registro = await navigator.serviceWorker.ready;
        function convertirClave(base64) {
            const padding = "=".repeat((4 - base64.length % 4) % 4);
            const texto = (base64 + padding).replace(/-/g, "+").replace(/_/g, "/");
            return Uint8Array.from(atob(texto), c => c.charCodeAt(0));
        }
        let suscripcion = await registro.pushManager.getSubscription();
        if (!suscripcion) {
            suscripcion = await registro.pushManager.subscribe({
                userVisibleOnly: true,
                applicationServerKey: convertirClave(VAPID_PUBLIC_KEY)
            });
        }
        const datos = suscripcion.toJSON();
        const { data: { user }, error: errorUsuario } = await supabaseClient.auth.getUser();
        if (errorUsuario || !user) throw new Error("No se pudo identificar al usuario");
        const { error } = await supabaseClient.from("push_subscriptions").upsert({
            endpoint: datos.endpoint,
            p256dh: datos.keys.p256dh,
            auth: datos.keys.auth,
            user_id: user.id
        }, { onConflict: "endpoint" });
        if (error) throw error;
        document.getElementById("btnNotificaciones").textContent = "🔔 Recordatorios activados";
        alert("✅ Dispositivo registrado correctamente.");
    } catch (error) {
        console.error(error);
        alert("❌ Error: " + error.message);
    }
}
function guardarDatos() {
    localStorage.setItem("pendientes", JSON.stringify(pendientes));
}

function mostrarFecha() {

    const hoy = new Date();

    const texto = hoy.toLocaleDateString(
        "es-MX",
        {
            weekday: "long",
            day: "numeric",
            month: "long"
        }
    );

    document.getElementById("fecha").textContent =
        texto.charAt(0).toUpperCase() + texto.slice(1);
}

function editarPendiente(id) {
    const pendiente = pendientes.find(p => p.id === id);
    if (!pendiente) return;
    editandoId = id;
    document.getElementById("tituloModal").textContent = "Editar pendiente";
    document.getElementById("nuevoPendiente").value = pendiente.texto;
    document.getElementById("fechaAviso").value = pendiente.aviso || "";
    document.querySelector("button.guardar").textContent = "Guardar cambios";
    mostrarModal();
}

function abrirModal() {
    editandoId = null;
    document.getElementById("tituloModal").textContent = "¿Qué tienes pendiente?";
    document.getElementById("nuevoPendiente").value = "";
    document.getElementById("fechaAviso").value = "";
    document.querySelector("button.guardar").textContent = "Guardar";
    mostrarModal();
}

function mostrarModal() {

    document.getElementById("modalFondo").style.display = "flex";

    setTimeout(() => {
        document.getElementById("nuevoPendiente").focus();
    }, 100);
}

function cerrarModal() {
    editandoId = null;

    document.getElementById("modalFondo").style.display = "none";

    document.getElementById("nuevoPendiente").value = "";
    document.getElementById("fechaAviso").value = "";
}

async function guardarPendiente() {
    const texto = document.getElementById("nuevoPendiente").value.trim();
    const aviso = document.getElementById("fechaAviso").value;
    if (!texto) { document.getElementById("nuevoPendiente").focus(); return; }
    const original = editandoId === null ? null : pendientes.find(p => p.id === editandoId);
    if (editandoId !== null && !original) return;
    const boton = document.querySelector("button.guardar");
    if (boton.disabled) return;
    boton.disabled = true;
    document.querySelector("button.cancelar").disabled = true;
    let recordatorioId = original?.recordatorioId || null;
    try {
        const cambio = !original || original.texto !== texto || original.aviso !== aviso;
        if (cambio && (aviso || original?.aviso)) {
            await iniciarSesion();
            const { data: { user }, error: errorUsuario } = await supabaseClient.auth.getUser();
            if (errorUsuario || !user) throw new Error("No se pudo identificar al usuario.");
            let endpoint;
            if (!recordatorioId || aviso) {
                if (!("serviceWorker" in navigator)) throw new Error("Abre la aplicación en tu dispositivo con recordatorios activados.");
                const registro = await navigator.serviceWorker.ready;
                const suscripcion = await registro.pushManager.getSubscription();
                if (!suscripcion) throw new Error("Primero pulsa Activar recordatorios en este dispositivo.");
                endpoint = suscripcion.endpoint;
            }
            // Los pendientes anteriores no guardaban el identificador del aviso.
            // Se busca únicamente el aviso original de este usuario y dispositivo.
            if (original?.aviso && !recordatorioId) {
                const { data, error } = await supabaseClient.from("recordatorios")
                    .select("id").eq("user_id", user.id).eq("endpoint", endpoint)
                    .eq("texto", original.texto)
                    .eq("fecha_aviso", new Date(original.aviso).toISOString())
                    .eq("enviado", false);
                if (error) throw error;
                if (data.length > 1) throw new Error("Hay varios avisos iguales; no se modificó ninguno.");
                recordatorioId = data[0]?.id || null;
            }
            if (recordatorioId) {
                let consulta;
                if (aviso) {
                    consulta = supabaseClient.from("recordatorios").update({
                        texto, fecha_aviso: new Date(aviso).toISOString(), enviado: false
                    });
                } else {
                    consulta = supabaseClient.from("recordatorios").delete();
                }
                const { data, error } = await consulta.eq("id", recordatorioId)
                    .eq("user_id", user.id).select("id");
                if (error) throw error;
                if (!data.length) throw new Error("No se pudo actualizar el aviso. Intenta de nuevo.");
                if (!aviso) recordatorioId = null;
            } else if (aviso) {
                const { data, error } = await supabaseClient.from("recordatorios").insert({
                    texto, endpoint, fecha_aviso: new Date(aviso).toISOString(),
                    user_id: user.id, enviado: false
                }).select("id").single();
                if (error) throw error;
                recordatorioId = data.id;
            }
        }
        if (original) {
            Object.assign(original, { texto, aviso, recordatorioId });
        } else {
            pendientes.unshift({
                id: Date.now(), texto, aviso, recordatorioId,
                terminado: false, fecha: new Date().toISOString()
            });
        }
        guardarDatos();
        cerrarModal();
        renderizar();
    } catch (error) {
        console.error(error);
        alert("No se pudo guardar: " + error.message);
    } finally {
        boton.disabled = false;
        document.querySelector("button.cancelar").disabled = false;
    }
}

function cambiarEstado(id) {

    const pendiente =
        pendientes.find(p => p.id === id);

    if (!pendiente) return;

    pendiente.terminado = !pendiente.terminado;

    guardarDatos();

    renderizar();
}

function borrarPendiente(id) {

    pendientes =
        pendientes.filter(p => p.id !== id);

    guardarDatos();

    renderizar();
}

function crearPendiente(p) {

    const div = document.createElement("div");

    div.className =
        "pendiente" + (p.terminado ? " terminado" : "");

    let hora = "";

    if (p.aviso) {

        const fecha = new Date(p.aviso);

        hora =
            `<div class="hora">
                🔔 ${fecha.toLocaleString("es-MX", {
                    day: "numeric",
                    month: "short",
                    hour: "numeric",
                    minute: "2-digit"
                })}
            </div>`;
    }

    div.innerHTML = `
        <div
            class="check ${p.terminado ? "hecho" : ""}"
            onclick="cambiarEstado(${p.id})">
        </div>

        <div class="contenido">
            <div class="texto">${escapar(p.texto)}</div>
            ${hora}
        </div>

        <button class="editar" onclick="editarPendiente(${p.id})">Editar</button>

        <button
            class="borrar"
            onclick="borrarPendiente(${p.id})">
            ×
        </button>
    `;

    return div;
}

function escapar(texto) {

    const div = document.createElement("div");

    div.textContent = texto;

    return div.innerHTML;
}

function renderizar() {

    const lista =
        document.getElementById("lista");

    const finalizados =
        document.getElementById("finalizados");

    lista.innerHTML = "";
    finalizados.innerHTML = "";

    const activos =
        pendientes.filter(p => !p.terminado);

    const hechos =
        pendientes.filter(p => p.terminado);

    document.getElementById("contador").textContent =
        `${activos.length} pendientes · ${hechos.length} terminados`;

    if (activos.length === 0) {

        lista.innerHTML =
            `<div class="vacio">
                🎉 No tienes pendientes
            </div>`;
    }

    activos.forEach(p => {
        lista.appendChild(crearPendiente(p));
    });

    hechos.forEach(p => {
        finalizados.appendChild(crearPendiente(p));
    });
}

// Arrullo sintetizado: no utiliza grabaciones ni descarga archivos de audio.
let audioPaloma = null;
let palomaActiva = false;
let inicioPaloma = Date.now();
let ultimoArrullo = -Infinity;
const avisosPaloma = new Set();
const CLAVE_AVISOS_PALOMA = "pendiente_avisos_paloma_v1";
try {
    const previos = JSON.parse(localStorage.getItem(CLAVE_AVISOS_PALOMA) || "[]");
    if (Array.isArray(previos)) previos.slice(-200).forEach(k => avisosPaloma.add(k));
} catch (_) { /* El audio sigue funcionando si no se puede leer el historial. */ }

function estadoSonidoPaloma() {
    const lista = palomaActiva && audioPaloma?.state === "running";
    document.getElementById("btnPaloma").textContent = lista
        ? "🕊️ Sonido activado" : "🔇 Sonido desactivado";
    document.getElementById("estadoPaloma").textContent = lista
        ? "Arrullo activado mientras la app esté visible. Para apagarlo, toca el botón."
        : "Sonido con la app visible. Toca el botón para activarlo.";
}

function arrullarPaloma() {
    if (!palomaActiva || document.visibilityState !== "visible" || audioPaloma?.state !== "running") return false;
    const ahora = audioPaloma.currentTime;
    if (ahora - ultimoArrullo < 3) return true; // Agrupa avisos simultáneos.
    ultimoArrullo = ahora;
    // Dos frases graves, con portamento y vibrato suave: cu-cu-ru-cú.
    for (let frase = 0; frase < 2; frase++) {
        const notas = [[0, .32, 390, 340], [.43, .62, 450, 330], [1.12, .32, 350, 300]];
        for (const [offset, duracion, agudo, grave] of notas) {
            const t = ahora + .03 + frase * 1.65 + offset;
            const voz = audioPaloma.createOscillator();
            const volumen = audioPaloma.createGain();
            const vibrato = audioPaloma.createOscillator();
            const profundidad = audioPaloma.createGain();
            voz.type = "sine";
            voz.frequency.setValueAtTime(agudo, t);
            voz.frequency.exponentialRampToValueAtTime(grave, t + duracion);
            vibrato.frequency.value = 22;
            profundidad.gain.value = 5;
            vibrato.connect(profundidad);
            profundidad.connect(voz.frequency);
            volumen.gain.setValueAtTime(0, t);
            volumen.gain.linearRampToValueAtTime(.22, t + .045);
            volumen.gain.exponentialRampToValueAtTime(.001, t + duracion);
            voz.connect(volumen);
            volumen.connect(audioPaloma.destination);
            voz.onended = () => { voz.disconnect(); volumen.disconnect(); vibrato.disconnect(); profundidad.disconnect(); };
            voz.start(t); vibrato.start(t);
            voz.stop(t + duracion + .02); vibrato.stop(t + duracion + .02);
        }
    }
    return true;
}

async function activarPaloma() {
    const boton = document.getElementById("btnPaloma");
    if (boton.disabled) return;
    if (palomaActiva && audioPaloma?.state === "running") {
        palomaActiva = false;
        await audioPaloma.suspend();
        estadoSonidoPaloma();
        return;
    }
    boton.disabled = true;
    try {
        const Contexto = window.AudioContext || window.webkitAudioContext;
        if (!Contexto) throw new Error("Este navegador no permite reproducir el arrullo.");
        if (!audioPaloma) {
            audioPaloma = new Contexto();
            audioPaloma.onstatechange = estadoSonidoPaloma;
        }
        await audioPaloma.resume();
        if (audioPaloma.state !== "running") throw new Error("Vuelve a tocar el botón para habilitar el audio.");
        palomaActiva = true;
        inicioPaloma = Date.now();
        arrullarPaloma();
        estadoSonidoPaloma();
    } catch (error) {
        palomaActiva = false;
        estadoSonidoPaloma();
        document.getElementById("estadoPaloma").textContent = error.message;
    } finally { boton.disabled = false; }
}

function revisarAvisosPaloma(ahora = Date.now()) {
    if (!palomaActiva || audioPaloma?.state !== "running" || document.visibilityState !== "visible") return;
    const vencidos = pendientes.filter(p => {
        if (p.terminado || !p.aviso) return false;
        const fecha = new Date(p.aviso).getTime();
        const clave = `${p.id}|${p.aviso}`;
        return Number.isFinite(fecha) && fecha >= inicioPaloma && fecha <= ahora
            && ahora - fecha < 90000 && !avisosPaloma.has(clave);
    });
    if (!vencidos.length || !arrullarPaloma()) return;
    vencidos.forEach(p => avisosPaloma.add(`${p.id}|${p.aviso}`));
    try { localStorage.setItem(CLAVE_AVISOS_PALOMA, JSON.stringify([...avisosPaloma].slice(-200))); } catch (_) {}
    const cartel = document.getElementById("avisoPaloma");
    cartel.textContent = "🕊️ Recordatorio: " + vencidos.map(p => p.texto).join(" · ");
    cartel.style.display = "block";
}
setInterval(revisarAvisosPaloma, 1000);
document.addEventListener("visibilitychange", () => {
    // Al regresar, no reproduce de golpe los avisos vencidos con la app oculta.
    inicioPaloma = Date.now();
    estadoSonidoPaloma();
});

mostrarFecha();
renderizar();

</script>
<script>
if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
        navigator.serviceWorker
            .register("./sw.js")
            .then(() => console.log("Pendiente listo"))
            .catch(error => console.log("Error:", error));
    });
}
</script>
</body>
