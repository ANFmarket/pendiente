<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Pendiente</title>
<link rel="manifest" href="manifest.json">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<meta name="theme-color" content="#007aff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pendiente">

<style>
    * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f5f5f7;
        color: #111;
    }

    .app {
        max-width: 520px;
        margin: auto;
        min-height: 100vh;
        background: white;
        padding: 55px 22px 35px;
    }

    .fecha {
        color: #777;
        font-size: 15px;
        margin-bottom: 4px;
    }

    h1 {
        font-size: 38px;
        margin: 0 0 10px;
    }

    .contador {
        display: inline-block;
        background: #f0f4f9;
        padding: 7px 13px;
        border-radius: 20px;
        font-size: 13px;
        margin-bottom: 28px;
    }

    #lista {
        margin-bottom: 25px;
    }

    .pendiente {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        padding: 14px 2px;
        border-bottom: 1px solid #eee;
    }

    .check {
        width: 27px;
        height: 27px;
        border: 2px solid #bbb;
        border-radius: 50%;
        flex-shrink: 0;
        cursor: pointer;
        margin-top: 1px;
    }

    .check.hecho {
        background: #007aff;
        border-color: #007aff;
        position: relative;
    }

    .check.hecho::after {
        content: "✓";
        color: white;
        position: absolute;
        left: 5px;
        top: 0px;
        font-size: 18px;
        font-weight: bold;
    }

    .contenido {
        flex: 1;
    }

    .texto {
        font-size: 17px;
        line-height: 1.3;
    }

    .terminado .texto {
        text-decoration: line-through;
        color: #999;
    }

    .hora {
        font-size: 13px;
        color: #777;
        margin-top: 5px;
    }

    .borrar {
        border: none;
        background: transparent;
        color: #bbb;
        font-size: 20px;
        cursor: pointer;
        padding: 0 4px;
    }

    .agregar {
        width: 100%;
        border: none;
        background: #007aff;
        color: white;
        font-size: 17px;
        font-weight: 600;
        padding: 15px;
        border-radius: 13px;
        cursor: pointer;
    }

    .finalizados-titulo {
        margin-top: 28px;
        padding: 14px 0;
        font-size: 14px;
        font-weight: 600;
        color: #666;
        border-top: 1px solid #eee;
    }

    .modal-fondo {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,.35);
        display: none;
        align-items: flex-end;
        justify-content: center;
    }

    .modal {
        width: 100%;
        max-width: 520px;
        background: white;
        border-radius: 20px 20px 0 0;
        padding: 25px 22px 35px;
    }

    .modal h2 {
        margin-top: 0;
        font-size: 23px;
    }

    input {
        width: 100%;
        padding: 15px;
        border: 1px solid #ddd;
        border-radius: 12px;
        font-size: 17px;
        outline: none;
        margin-bottom: 14px;
    }

    input:focus {
        border-color: #007aff;
    }

    .aviso {
        font-size: 14px;
        font-weight: 600;
        margin: 8px 0;
    }

    input[type="datetime-local"] {
        font-size: 15px;
    }

    .guardar {
        width: 100%;
        border: none;
        background: #007aff;
        color: white;
        padding: 14px;
        border-radius: 12px;
        font-size: 17px;
        font-weight: 600;
        cursor: pointer;
    }

    .cancelar {
        width: 100%;
        border: none;
        background: transparent;
        color: #007aff;
        padding: 14px;
        font-size: 16px;
        cursor: pointer;
        margin-top: 5px;
    }

    .vacio {
        text-align: center;
        color: #999;
        padding: 35px 10px;
    }
</style>
</head>

<body>

<div class="app">

    <div class="fecha" id="fecha"></div>

    <h1>Hoy</h1>

    <div class="contador" id="contador">
        0 pendientes · 0 terminados
    </div>

    <div id="lista"></div>

    <button class="agregar" onclick="abrirModal()">
        ＋ Agregar pendiente
    </button>
<button
    id="btnNotificaciones"
    onclick="activarNotificaciones()"
    style="
        width:100%;
        border:none;
        background:#f0f4f9;
        color:#007aff;
        font-size:15px;
        font-weight:600;
        padding:13px;
        border-radius:13px;
        cursor:pointer;
        margin-top:10px;
    ">
    🔔 Activar recordatorios
</button>
<button
    onclick="probarNotificacion()"
    style="
        width:100%;
        border:none;
        background:#f0f4f9;
        color:#007aff;
        font-size:15px;
        font-weight:600;
        padding:13px;
        border-radius:13px;
        cursor:pointer;
        margin-top:10px;
    ">
    🧪 Probar notificación
</button>
<button
    onclick="probarSupabase()"
    style="
        width:100%;
        border:none;
        background:#f0f4f9;
        color:#007aff;
        font-size:15px;
        font-weight:600;
        padding:13px;
        border-radius:13px;
        cursor:pointer;
        margin-top:10px;
    ">
    ☁️ Probar conexión
</button>

    <div class="finalizados-titulo">
        Finalizados de hoy
    </div>

    <div id="finalizados"></div>

</div>

<div class="modal-fondo" id="modalFondo">

    <div class="modal">

        <h2>¿Qué tienes pendiente?</h2>

        <input
            id="nuevoPendiente"
            type="text"
            placeholder="Escribe tu pendiente..."
            autocomplete="off"
        >

        <div class="aviso">🔔 Avisarme (opcional)</div>

        <input
            id="fechaAviso"
            type="datetime-local"
        >

        <button class="guardar" onclick="guardarPendiente()">
            Guardar
        </button>

        <button class="cancelar" onclick="cerrarModal()">
            Cancelar
        </button>

    </div>

</div>

<script>
const SUPABASE_URL = "https://pteopgkjtaggattgmrue.supabase.co";
const SUPABASE_KEY = "sb_publishable_Hs72KK_8xIX_ZgNFLFEYbw_wjHmRVSV";
const VAPID_PUBLIC_KEY = "BLVuCTL8nGx1z--JVIxYnzB7HIta0oDieZC_ah8y877is5RcnpiGEWB5xfBDe0D05phv9s5YyOYWudJPKc_-kxg";


const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);
async function probarSupabase() {
    const { error } = await supabaseClient
        .from("push_subscriptions")
        .insert({
            endpoint: "prueba-" + Date.now(),
            p256dh: "prueba",
            auth: "prueba"
        });

    if (error) {
        alert("❌ Supabase: " + error.message);
    } else {
        alert("✅ Pendiente conectado con Supabase");
    }
}
let pendientes = JSON.parse(localStorage.getItem("pendientes")) || [];


async function activarNotificaciones() {
    try {
        if (!("Notification" in window) ||
            !("serviceWorker" in navigator) ||
            !("PushManager" in window)) {
            alert("Este navegador no admite notificaciones push.");
            return;
        }

        const permiso = await Notification.requestPermission();

        if (permiso !== "granted") {
            alert("Necesitamos permiso para las notificaciones.");
            return;
        }

        const registro = await navigator.serviceWorker.ready;

        function convertirClave(base64) {
            const padding = "=".repeat((4 - base64.length % 4) % 4);
            const texto = (base64 + padding)
                .replace(/-/g, "+")
                .replace(/_/g, "/");

            return Uint8Array.from(atob(texto), c => c.charCodeAt(0));
        }

        let suscripcion = await registro.pushManager.getSubscription();

        if (!suscripcion) {
            suscripcion = await registro.pushManager.subscribe({
                userVisibleOnly: true,
                applicationServerKey: convertirClave(VAPID_PUBLIC_KEY)
            });
        }

        const datos = suscripcion.toJSON();

        const { error } = await supabaseClient
            .from("push_subscriptions")
            .upsert({
                endpoint: datos.endpoint,
                p256dh: datos.keys.p256dh,
                auth: datos.keys.auth
            }, {
                onConflict: "endpoint"
            });

        if (error) throw error;

        document.getElementById("btnNotificaciones").textContent =
            "🔔 Recordatorios activados";

        alert("✅ Dispositivo registrado correctamente.");

    } catch (error) {
        console.error(error);
        alert("❌ Error: " + error.message);
    }
}

async function probarNotificacion() {

    if (Notification.permission !== "granted") {
        alert("Primero activa los recordatorios 🔔");
        return;
    }

    const activos = pendientes.filter(p => !p.terminado);

    let mensaje;

    if (activos.length > 0) {

        const elegido =
            activos[Math.floor(Math.random() * activos.length)];

        const frases = [
            `👀 Oye, ¿cómo vas con "${elegido.texto}"?`,
            `😎 ¿Ya puedo tachar "${elegido.texto}"?`,
            `☑️ No se nos olvide: "${elegido.texto}"`,
            `👀 Todavía tenemos pendiente "${elegido.texto}". ¿Cómo vamos?`
        ];

        mensaje =
            frases[Math.floor(Math.random() * frases.length)];

    } else {
        mensaje = "🎉 No tienes pendientes. Ya acabamos por hoy 😎";
    }

    try {
        const registro = await navigator.serviceWorker.ready;

        await registro.showNotification("Pendiente ☑️", {
            body: mensaje,
            icon: "./icon-512.png",
            badge: "./icon-512.png"
        });

    } catch (error) {
        alert("No pude enviar la notificación: " + error.message);
    }
}
function guardarDatos() {
    localStorage.setItem("pendientes", JSON.stringify(pendientes));
}

function mostrarFecha() {

    const hoy = new Date();

    const texto = hoy.toLocaleDateString(
        "es-MX",
        {
            weekday: "long",
            day: "numeric",
            month: "long"
        }
    );

    document.getElementById("fecha").textContent =
        texto.charAt(0).toUpperCase() + texto.slice(1);
}

function abrirModal() {

    document.getElementById("modalFondo").style.display = "flex";

    setTimeout(() => {
        document.getElementById("nuevoPendiente").focus();
    }, 100);
}

function cerrarModal() {

    document.getElementById("modalFondo").style.display = "none";

    document.getElementById("nuevoPendiente").value = "";
    document.getElementById("fechaAviso").value = "";
}

function guardarPendiente() {

    const texto =
        document.getElementById("nuevoPendiente").value.trim();

    const aviso =
        document.getElementById("fechaAviso").value;

    if (!texto) {
        return;
    }

    pendientes.unshift({
        id: Date.now(),
        texto: texto,
        aviso: aviso,
        terminado: false,
        fecha: new Date().toISOString()
    });

    guardarDatos();

    cerrarModal();

    renderizar();
}

function cambiarEstado(id) {

    const pendiente =
        pendientes.find(p => p.id === id);

    if (!pendiente) return;

    pendiente.terminado = !pendiente.terminado;

    guardarDatos();

    renderizar();
}

function borrarPendiente(id) {

    pendientes =
        pendientes.filter(p => p.id !== id);

    guardarDatos();

    renderizar();
}

function crearPendiente(p) {

    const div = document.createElement("div");

    div.className =
        "pendiente" + (p.terminado ? " terminado" : "");

    let hora = "";

    if (p.aviso) {

        const fecha = new Date(p.aviso);

        hora =
            `<div class="hora">
                🔔 ${fecha.toLocaleString("es-MX", {
                    day: "numeric",
                    month: "short",
                    hour: "numeric",
                    minute: "2-digit"
                })}
            </div>`;
    }

    div.innerHTML = `
        <div
            class="check ${p.terminado ? "hecho" : ""}"
            onclick="cambiarEstado(${p.id})">
        </div>

        <div class="contenido">
            <div class="texto">${escapar(p.texto)}</div>
            ${hora}
        </div>

        <button
            class="borrar"
            onclick="borrarPendiente(${p.id})">
            ×
        </button>
    `;

    return div;
}

function escapar(texto) {

    const div = document.createElement("div");

    div.textContent = texto;

    return div.innerHTML;
}

function renderizar() {

    const lista =
        document.getElementById("lista");

    const finalizados =
        document.getElementById("finalizados");

    lista.innerHTML = "";
    finalizados.innerHTML = "";

    const activos =
        pendientes.filter(p => !p.terminado);

    const hechos =
        pendientes.filter(p => p.terminado);

    document.getElementById("contador").textContent =
        `${activos.length} pendientes · ${hechos.length} terminados`;

    if (activos.length === 0) {

        lista.innerHTML =
            `<div class="vacio">
                🎉 No tienes pendientes
            </div>`;
    }

    activos.forEach(p => {
        lista.appendChild(crearPendiente(p));
    });

    hechos.forEach(p => {
        finalizados.appendChild(crearPendiente(p));
    });
}

mostrarFecha();
renderizar();

</script>
<script>
if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
        navigator.serviceWorker
            .register("./sw.js")
            .then(() => console.log("Pendiente listo"))
            .catch(error => console.log("Error:", error));
    });
}
</script>
</body>
</html>
