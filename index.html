<body>

<div class="app">
    <div class="brand" aria-label="PENDIENTE">
      <div class="brand-icon" aria-hidden="true"><span class="p">P</span><span class="tick">✓</span></div>
      <div><div class="brand-name">PENDIENTE</div><div class="brand-sub">Tu día, en orden.</div></div>
    </div>

    <div class="fecha" id="fecha"></div>

    <h1>Hoy</h1>

    <div class="contador" id="contador">
        0 pendientes · 0 terminados
    </div>

    <div id="lista"></div>

    <button class="agregar" onclick="abrirModal()">
        ＋ Agregar pendiente
    </button>
<button
    id="btnNotificaciones"
    onclick="activarNotificaciones()"
    style="
        width:100%;
        border:none;
        background:#f0f4f9;
        color:#007aff;
        font-size:15px;
        font-weight:600;
        padding:13px;
        border-radius:13px;
        cursor:pointer;
        margin-top:10px;
    ">
    🔔 Activar recordatorios
</button>
<div class="finalizados-titulo">
        Finalizados de hoy
    </div>

    <div id="finalizados"></div>

</div>

<div class="modal-fondo" id="modalFondo">

    <div class="modal">

        <h2>¿Qué tienes pendiente?</h2>

        <input
            id="nuevoPendiente"
            type="text"
            placeholder="Escribe tu pendiente..."
            autocomplete="off"
        >

        <div class="aviso">🔔 Avisarme (opcional)</div>

        <input
            id="fechaAviso"
            type="datetime-local"
        >

        <button class="guardar" onclick="guardarPendiente()">
            Guardar
        </button>

        <button class="cancelar" onclick="cerrarModal()">
            Cancelar
        </button>

    </div>

</div>

<script>
const SUPABASE_URL = "https://pteopgkjtaggattgmrue.supabase.co";
const SUPABASE_KEY = "sb_publishable_Hs72KK_8xIX_ZgNFLFEYbw_wjHmRVSV";
const VAPID_PUBLIC_KEY = "BLVuCTL8nGx1z--JVIxYnzB7HIta0oDieZC_ah8y877is5RcnpiGEWB5xfBDe0D05phv9s5YyOYWudJPKc_-kxg";


const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);
let pendientes = JSON.parse(localStorage.getItem("pendientes")) || [];

let usuarioActual = null;
let sincronizacionLista = false;

function filaPendiente(p) {
    return {
        id: String(p.id), user_id: usuarioActual.id, texto: p.texto,
        aviso: p.aviso ? new Date(p.aviso).toISOString() : null,
        terminado: Boolean(p.terminado),
        creado: p.fecha || new Date().toISOString()
    };
}

async function subirPendiente(p) {
    if (!usuarioActual) throw new Error("No hay sesión activa.");
    const { error } = await supabaseClient.from("pendientes")
        .upsert(filaPendiente(p), { onConflict: "id" });
    if (error) throw error;
}

async function iniciarSesion() {
    try {
        let { data: { session }, error } = await supabaseClient.auth.getSession();
        if (error) throw error;
        if (!session) {
            const respuesta = await supabaseClient.auth.signInAnonymously();
            if (respuesta.error) throw respuesta.error;
            session = respuesta.data.session;
        }
        if (!session?.user) throw new Error("No se pudo iniciar sesión.");
        usuarioActual = session.user;
        // Primero migrar los pendientes existentes del dispositivo, sin borrarlos.
        for (const p of pendientes) await subirPendiente(p);
        const respuesta = await supabaseClient.from("pendientes")
            .select("id,texto,aviso,terminado,creado")
            .eq("user_id", usuarioActual.id);
        if (respuesta.error) throw respuesta.error;
        const existentes = new Set(pendientes.map(p => String(p.id)));
        for (const r of respuesta.data || []) {
            if (existentes.has(r.id)) continue;
            // Las fechas se convierten al formato local requerido por datetime-local.
            const d = r.aviso ? new Date(r.aviso) : null;
            const local = d ? new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,16) : "";
            pendientes.push({id: Number(r.id), texto:r.texto, aviso:local,
                terminado:r.terminado, fecha:r.creado});
        }
        pendientes.sort((x,y) => new Date(y.fecha) - new Date(x.fecha));
        guardarDatos();
        sincronizacionLista = true;
        renderizar();
    } catch (e) {
        console.error("Sincronización de pendientes:", e);
        alert("No se pudo conectar con Supabase. Tus pendientes locales están a salvo. Comprueba la conexión y vuelve a abrir PENDIENTE. Detalle: " + e.message);
    }
}
iniciarSesion();

async function activarNotificaciones() {
    try {
        if (!("Notification" in window) || !("serviceWorker" in navigator) || !("PushManager" in window)) {
            alert("Este navegador no admite notificaciones push.");
            return;
        }
        const permiso = await Notification.requestPermission();
        if (permiso !== "granted") {
            alert("Necesitamos permiso para las notificaciones.");
            return;
        }
        const registro = await navigator.serviceWorker.ready;
        function convertirClave(base64) {
            const padding = "=".repeat((4 - base64.length % 4) % 4);
            const texto = (base64 + padding).replace(/-/g, "+").replace(/_/g, "/");
            return Uint8Array.from(atob(texto), c => c.charCodeAt(0));
        }
        let suscripcion = await registro.pushManager.getSubscription();
        if (!suscripcion) {
            suscripcion = await registro.pushManager.subscribe({
                userVisibleOnly: true,
                applicationServerKey: convertirClave(VAPID_PUBLIC_KEY)
            });
        }
        const datos = suscripcion.toJSON();
        const { data: { user }, error: errorUsuario } = await supabaseClient.auth.getUser();
        if (errorUsuario || !user) throw new Error("No se pudo identificar al usuario");
        const { error } = await supabaseClient.from("push_subscriptions").upsert({
            endpoint: datos.endpoint,
            p256dh: datos.keys.p256dh,
            auth: datos.keys.auth,
            user_id: user.id
        }, { onConflict: "endpoint" });
        if (error) throw error;
        document.getElementById("btnNotificaciones").textContent = "🔔 Recordatorios activados";
        alert("✅ Dispositivo registrado correctamente.");
    } catch (error) {
        console.error(error);
        alert("❌ Error: " + error.message);
    }
}
function guardarDatos() {
    localStorage.setItem("pendientes", JSON.stringify(pendientes));
}

function mostrarFecha() {

    const hoy = new Date();

    const texto = hoy.toLocaleDateString(
        "es-MX",
        {
            weekday: "long",
            day: "numeric",
            month: "long"
        }
    );

    document.getElementById("fecha").textContent =
        texto.charAt(0).toUpperCase() + texto.slice(1);
}

function abrirModal() {

    document.getElementById("modalFondo").style.display = "flex";

    setTimeout(() => {
        document.getElementById("nuevoPendiente").focus();
    }, 100);
}

function cerrarModal() {

    document.getElementById("modalFondo").style.display = "none";

    document.getElementById("nuevoPendiente").value = "";
    document.getElementById("fechaAviso").value = "";
}

async function guardarPendiente() {
    const texto = document.getElementById("nuevoPendiente").value.trim();
    const aviso = document.getElementById("fechaAviso").value;
    if (!texto) return;
    if (!sincronizacionLista) { alert("Espera a que termine la sincronización con Supabase."); return; }
    const boton = document.querySelector("button.guardar");
    boton.disabled = true;
    let nuevo = null;
    try {
        nuevo = {
            id: Date.now() * 1000 + Math.floor(Math.random()*1000),
            texto, aviso, terminado:false, fecha:new Date().toISOString()
        };
        await subirPendiente(nuevo);
        if (aviso) {
            const registro = await navigator.serviceWorker.ready;
            const suscripcion = await registro.pushManager.getSubscription();
            if (!suscripcion) throw new Error("Primero pulsa Activar recordatorios para registrar este dispositivo.");
            const { data: { user }, error: errorUsuario } = await supabaseClient.auth.getUser();
            if (errorUsuario || !user) throw new Error("No se pudo identificar al usuario.");
            const { error } = await supabaseClient.from("recordatorios").insert({
                texto: texto,
                endpoint: suscripcion.endpoint,
                fecha_aviso: new Date(aviso).toISOString(),
                user_id: user.id,
                enviado: false
            });
            if (error) throw error;
        }
        pendientes.unshift(nuevo);
        guardarDatos();
        cerrarModal();
        renderizar();
    } catch (error) {
        console.error(error);
        if (nuevo) {
            const { error: rollbackError } = await supabaseClient.from("pendientes")
                .delete().eq("id", String(nuevo.id)).eq("user_id", usuarioActual.id);
            if (rollbackError) console.error("Error revirtiendo alta:", rollbackError);
        }
        alert("No se pudo guardar el pendiente: " + error.message);
    } finally {
        boton.disabled = false;
    }
}

async function cancelarRecordatorio(pendiente) {
    if (!pendiente.aviso) return;
    const registro = await navigator.serviceWorker.ready;
    const suscripcion = await registro.pushManager.getSubscription();
    if (!suscripcion) throw new Error("No hay suscripción de notificaciones en este dispositivo.");
    const { data: { user }, error: errorUsuario } = await supabaseClient.auth.getUser();
    if (errorUsuario || !user) throw new Error("No se pudo identificar al usuario.");
    const { error } = await supabaseClient.from("recordatorios")
        .delete()
        .eq("user_id", user.id)
        .eq("endpoint", suscripcion.endpoint)
        .eq("texto", pendiente.texto)
        .eq("fecha_aviso", new Date(pendiente.aviso).toISOString())
        .eq("enviado", false);
    if (error) throw error;
}

async function cambiarEstado(id) {
    if (!sincronizacionLista) return alert("Espera a que termine la sincronización.");
    const pendiente = pendientes.find(p => p.id === id);
    if (!pendiente) return;
    if (!pendiente.terminado && pendiente.aviso) {
        try { await cancelarRecordatorio(pendiente); }
        catch (error) {
            console.error(error);
            alert("No se pudo cancelar el recordatorio. Intenta nuevamente: " + error.message);
            return;
        }
    }
    const actualizado = {...pendiente, terminado: !pendiente.terminado};
    // Al reabrir un pendiente, el aviso anterior no se reactiva automáticamente.
    if (!actualizado.terminado && actualizado.aviso) actualizado.aviso = "";
    try { await subirPendiente(actualizado); }
    catch (error) { alert("No se pudo actualizar el pendiente: " + error.message); return; }
    Object.assign(pendiente, actualizado);
    guardarDatos();
    renderizar();
}

async function borrarPendiente(id) {
    if (!sincronizacionLista) return alert("Espera a que termine la sincronización.");
    const pendiente = pendientes.find(p => p.id === id);
    if (!pendiente) return;
    if (!pendiente.terminado && pendiente.aviso) {
        try { await cancelarRecordatorio(pendiente); }
        catch (error) {
            console.error(error);
            alert("No se pudo cancelar el recordatorio. Intenta nuevamente: " + error.message);
            return;
        }
    }
    const { error } = await supabaseClient.from("pendientes")
        .delete().eq("id", String(id)).eq("user_id", usuarioActual.id);
    if (error) { alert("No se pudo eliminar el pendiente: " + error.message); return; }
    pendientes = pendientes.filter(p => p.id !== id);
    guardarDatos();
    renderizar();
}

function crearPendiente(p) {

    const div = document.createElement("div");

    div.className =
        "pendiente" + (p.terminado ? " terminado" : "");

    let hora = "";

    if (p.aviso) {

        const fecha = new Date(p.aviso);

        hora =
            `<div class="hora">
                🔔 ${fecha.toLocaleString("es-MX", {
                    day: "numeric",
                    month: "short",
                    hour: "numeric",
                    minute: "2-digit"
                })}
            </div>`;
    }

    div.innerHTML = `
        <div
            class="check ${p.terminado ? "hecho" : ""}"
            onclick="cambiarEstado(${p.id})">
        </div>

        <div class="contenido">
            <div class="texto">${escapar(p.texto)}</div>
            ${hora}
        </div>

        <button
            class="borrar"
            onclick="borrarPendiente(${p.id})">
            ×
        </button>
    `;

    return div;
}

function escapar(texto) {

    const div = document.createElement("div");

    div.textContent = texto;

    return div.innerHTML;
}

function renderizar() {

    const lista =
        document.getElementById("lista");

    const finalizados =
        document.getElementById("finalizados");

    lista.innerHTML = "";
    finalizados.innerHTML = "";

    const activos =
        pendientes.filter(p => !p.terminado);

    const hechos =
        pendientes.filter(p => p.terminado);

    document.getElementById("contador").textContent =
        `${activos.length} pendientes · ${hechos.length} terminados`;

    if (activos.length === 0) {

        lista.innerHTML =
            `<div class="vacio">
                🎉 No tienes pendientes
            </div>`;
    }

    activos.forEach(p => {
        lista.appendChild(crearPendiente(p));
    });

    hechos.forEach(p => {
        finalizados.appendChild(crearPendiente(p));
    });
}

mostrarFecha();
renderizar();

</script>
